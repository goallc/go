name: GoALLC

on:
  push:
    branches:
      - go1.27.master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      llvm-pr:
        description: Optional goallc/llvm-project PR number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: goallc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_LLVM_RELEASE: goallc-llvm23.1.0-20260903T120924Z
  PINNED_LLVM_REVISION: d12846b263fbc61c53d264b9e2b27bee2a7a02be

jobs:
  llvm-payload:
    name: select LLVM payload
    runs-on: ubuntu-22.04
    timeout-minutes: 220
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      asset_prefix: ${{ steps.resolve.outputs.asset_prefix }}
      revision: ${{ steps.resolve.outputs.revision }}
      source: ${{ steps.resolve.outputs.source }}

    steps:
      - name: Check out Go
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve LLVM payload
        id: resolve
        run: |
          .github/scripts/resolve-llvm-payload.py \
            --event="$GITHUB_EVENT_PATH" \
            --github-output="$GITHUB_OUTPUT" \
            --pinned-release="$PINNED_LLVM_RELEASE" \
            --pinned-revision="$PINNED_LLVM_REVISION"

      - name: Summarize LLVM payload
        env:
          LLVM_PAYLOAD_MODE: ${{ steps.resolve.outputs.mode }}
          LLVM_PAYLOAD_SOURCE: ${{ steps.resolve.outputs.source }}
        run: |
          {
            echo '## LLVM payload selection'
            echo
            echo "- mode: $LLVM_PAYLOAD_MODE"
            echo "- source: $LLVM_PAYLOAD_SOURCE"
          } >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: ${{ matrix.name }}
    needs: llvm-payload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            name: linux-amd64
            task: testdir
            shard: 0
            shards: 1
          - arch: amd64
            runner: ubuntu-22.04
            name: linux-amd64-stdlib-1-of-2
            task: stdlib
            shard: 0
            shards: 2
          - arch: amd64
            runner: ubuntu-22.04
            name: linux-amd64-stdlib-2-of-2
            task: stdlib
            shard: 1
            shards: 2
          - arch: arm64
            runner: ubuntu-22.04-arm
            name: linux-arm64
            task: testdir
            shard: 0
            shards: 1
          - arch: arm64
            runner: ubuntu-22.04-arm
            name: linux-arm64-stdlib-1-of-2
            task: stdlib
            shard: 0
            shards: 2
          - arch: arm64
            runner: ubuntu-22.04-arm
            name: linux-arm64-stdlib-2-of-2
            task: stdlib
            shard: 1
            shards: 2
    env:
      LLVM_RELEASE: ${{ needs.llvm-payload.outputs.release_tag }}
      LLVM_REVISION: ${{ needs.llvm-payload.outputs.revision }}
      LLVM_ARCHIVE: ${{ needs.llvm-payload.outputs.asset_prefix }}-linux-${{ matrix.arch }}.tar.zst
      LLVM_ROOT: ${{ github.workspace }}/.goallc/llvm
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Check out Go
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install bootstrap Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Install LLVM runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libedit-dev \
            libxml2-dev \
            libzstd-dev \
            ninja-build \
            zlib1g-dev

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: goallc-go-linux-${{ matrix.arch }}-${{ env.LLVM_REVISION }}-${{ github.sha }}
          restore-keys: |
            goallc-go-linux-${{ matrix.arch }}-

      - name: Download selected LLVM payload
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/goallc/llvm-project/releases/download/$LLVM_RELEASE/$LLVM_ARCHIVE"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$LLVM_ARCHIVE" "$url"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$LLVM_ARCHIVE.sha256" "$url.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check --strict "$LLVM_ARCHIVE.sha256"
          )
          mkdir -p "$LLVM_ROOT"
          tar --zstd -xf "$RUNNER_TEMP/$LLVM_ARCHIVE" \
            -C "$LLVM_ROOT" --strip-components=1

      - name: Summarize selected LLVM payload
        env:
          LLVM_PAYLOAD_MODE: ${{ needs.llvm-payload.outputs.mode }}
          LLVM_PAYLOAD_SOURCE: ${{ needs.llvm-payload.outputs.source }}
        run: |
          {
            echo '## LLVM payload'
            echo
            echo "- mode: $LLVM_PAYLOAD_MODE"
            echo "- source: $LLVM_PAYLOAD_SOURCE"
            echo "- archive: $LLVM_ARCHIVE"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Validate LLVM payload
        shell: bash
        run: |
          set -euo pipefail
          llvm_version="$("$LLVM_ROOT/bin/llvm-config" --version)"
          test "$("$LLVM_ROOT/bin/llvm-config" --prefix)" = "$LLVM_ROOT"
          [[ "$llvm_version" == 23.1.0* ]]
          test "$("$LLVM_ROOT/bin/llvm-config" --build-mode)" = Release
          grep -Fx "llvm_revision=$LLVM_REVISION" "$LLVM_ROOT/share/goallc/build-manifest"
          grep -Fx "llvm_version=$llvm_version" "$LLVM_ROOT/share/goallc/build-manifest"
          grep -Fx 'llvm_dirty=false' "$LLVM_ROOT/share/goallc/build-manifest"
          grep -Fx 'build_type=Release' "$LLVM_ROOT/share/goallc/build-manifest"
          for target in X86 AArch64; do
            "$LLVM_ROOT/bin/llvm-config" --targets-built | tr ' ' '\n' | grep -Fx "$target"
          done
          for tool in FileCheck llc llvm-ar llvm-config opt; do
            test -x "$LLVM_ROOT/bin/$tool"
          done
          test -f "$LLVM_ROOT/include/llvm-c/Core.h"
          test -f "$LLVM_ROOT/include/llvm/Config/llvm-config.h"
          test -f "$LLVM_ROOT/lib/cmake/llvm/LLVMConfig.cmake"
          test -f "$LLVM_ROOT/lib/libLLVMCore.a"
          find "$LLVM_ROOT/lib" -maxdepth 1 -name 'libLLVM.so*' -print -quit | grep .
          if ldd "$LLVM_ROOT/bin/llc" | grep 'not found'; then
            exit 1
          fi
          "$LLVM_ROOT/bin/llc" --version

      - name: Build Go through make.bash
        working-directory: src
        env:
          GOALLC_CCACHE: /usr/bin/ccache
        run: |
          ./make.bash \
            -llvm-dir="$LLVM_ROOT" \
            -llvm-version=23 \
            -llvm-link=dynamic

      - name: Test pass plugin
        if: matrix.task == 'testdir'
        shell: bash
        run: |
          set -euo pipefail
          plugin_build="$GITHUB_WORKSPACE/pkg/goallc-llvmplugin"
          test -f "$plugin_build/lib/GoALLCStatepoints.so"
          test -f "$plugin_build/lib/libGoALLCStatepointsStatic.a"
          test ! -e "$LLVM_ROOT/lib/GoALLCStatepoints.so"
          test ! -e "$LLVM_ROOT/lib/libGoALLCStatepointsStatic.a"
          "$GITHUB_WORKSPACE/bin/go" build \
            -o "$plugin_build/goallc-objview" cmd/objview
          cmake -S "$GITHUB_WORKSPACE/src/cmd/llvmplugin" \
            -B "$plugin_build" -G Ninja \
            -DLLVM_DIR="$LLVM_ROOT/lib/cmake/llvm" \
            -DCMAKE_INSTALL_PREFIX="$plugin_build" \
            -DBUILD_TESTING=ON \
            -DGOALLC_OBJVIEW_EXECUTABLE="$plugin_build/goallc-objview" \
            -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache
          cmake --build "$plugin_build" \
            --target GoALLCStatepoints --parallel "$(nproc)"
          ctest --test-dir "$plugin_build" \
            --output-on-failure -j "$(nproc)"

      - name: Test GoALLC infrastructure
        if: matrix.task == 'testdir'
        shell: bash
        run: |
          set -euo pipefail
          ./bin/go test cmd/dist cmd/internal/llvmbackend cmd/go/internal/work

      - name: Test linker DWARF with LLVM fixtures
        if: matrix.task == 'testdir'
        shell: bash
        env:
          GOALLC_LLVM_DIR: ${{ env.LLVM_ROOT }}
          GOALLC_RUN_LLVM_STDLIB: "1"
        run: |
          set -euo pipefail
          ./bin/go test -count=1 -timeout=10m -v cmd/link/internal/ld

      - name: Provision swap for LLVM qualification tests
        shell: bash
        run: |
          set -euo pipefail
          swap_file="$RUNNER_TEMP/goallc.swap"
          df -h "$RUNNER_TEMP"
          sudo fallocate -l 4G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          free -h
          swapon --show
          df -h "$RUNNER_TEMP"

      - name: Test LLVM standard library package policy
        if: matrix.task == 'stdlib'
        shell: bash
        env:
          GOALLC_LLVM_DIR: ${{ env.LLVM_ROOT }}
          GOALLC_FILECHECK: ${{ env.LLVM_ROOT }}/bin/FileCheck
          GOALLC_RUN_LLVM_STDLIB: "1"
          GOALLC_STDLIB_TEST_MODE: ${{ github.event_name == 'pull_request' && 'short' || 'long' }}
        run: |
          set -euo pipefail
          mode_args=()
          if [[ "$GOALLC_STDLIB_TEST_MODE" == "short" ]]; then
            mode_args=(-short)
          fi
          echo "LLVM standard library test mode: $GOALLC_STDLIB_TEST_MODE"
          ./bin/go test "${mode_args[@]}" cmd/internal/testdir \
            -run '^TestLLVM$/^stdlib$' \
            -count=1 \
            -timeout=100m \
            -shard=${{ matrix.shard }} \
            -shards=${{ matrix.shards }} \
            -v

      - name: Test LLVM testdir
        if: matrix.task == 'testdir'
        shell: bash
        env:
          GOALLC_LLVM_DIR: ${{ env.LLVM_ROOT }}
          GOALLC_FILECHECK: ${{ env.LLVM_ROOT }}/bin/FileCheck
        run: |
          set -o pipefail
          ./bin/go test cmd/internal/testdir \
            -run '^TestLLVM$/^testdir$' \
            -count=1 \
            -timeout=100m \
            -json \
            2>&1 | tee "$RUNNER_TEMP/goallc-test-results.json" \
              | jq --unbuffered -rj 'select(.Output != null) | .Output'

      - name: Publish LLVM test summary
        if: always() && matrix.task == 'testdir'
        env:
          GOALLC_CI_ARCH: ${{ matrix.arch }}
        run: |
          .github/scripts/goallc-test-summary.py \
            "$RUNNER_TEMP/goallc-test-results.json" \
            "$GITHUB_STEP_SUMMARY"

      - name: Remove LLVM qualification test swap
        if: always()
        shell: bash
        run: |
          swap_file="$RUNNER_TEMP/goallc.swap"
          if [[ -e "$swap_file" ]]; then
            sudo swapoff "$swap_file" || true
            sudo rm -f "$swap_file"
          fi

      - name: Report ccache
        if: always()
        run: ccache -s
