name: GoALLC runner diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    env:
      GOROOT: ${{ github.workspace }}
      GOCACHE: ${{ github.workspace }}/.go-build
      GO_BUILDER_NAME: goallc-linux-arm64
      GO_TEST_SHARDS: "2"
      GO_TEST_SHORT: "true"
      GO_TEST_TIMEOUT_SCALE: "4"
      GOENV: "off"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libedit-dev libxml2-dev libzstd-dev zlib1g-dev
      - uses: actions/download-artifact@v5
        with:
          name: goallc-sdk-arm64
          run-id: 35175515343
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sdk
      - name: Restore exact failed SDK
        run: |
          mkdir -p "$GOCACHE"
          tar --zstd -xf "$RUNNER_TEMP/sdk/go-build-cache.tar.zst" -C "$GOCACHE"
          tar --zstd -xf "$RUNNER_TEMP/sdk/goallc-sdk.tar.zst"
          mkdir -p .goallc/llvm
          tar --zstd -xf "$RUNNER_TEMP/sdk/llvm-test-tools.tar.zst" -C .goallc/llvm
          ln -sfn "$GITHUB_WORKSPACE/.goallc/llvm" src/cmd/vendor/github.com/goallc/go-llvm/llvm
          printf '%s\n' "$GITHUB_WORKSPACE/.goallc/llvm" > pkg/goallc-llvm-payload
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          ./bin/go tool compile -V=full
      - name: Reproduce original testdir shard with resource telemetry
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/goallc-resource-monitor.sh > >(tee "$RUNNER_TEMP/resources.log") 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; sudo dmesg -T > "$RUNNER_TEMP/kernel.log" || true' EXIT
          cd src
          bash ./run.bash --no-rebuild -k -json cmd/internal/testdir:0_2 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-resource-diagnostics
          path: |
            ${{ runner.temp }}/resources.log
            ${{ runner.temp }}/kernel.log
            ${{ runner.temp }}/test.log
