name: Static SDK release candidate

# A new immutable four-host LLVM payload must be published first. Existing
# Linux dynamic CI remains independent until that release is pinned.
on:
  workflow_dispatch:
    inputs:
      llvm-release:
        description: Immutable LLVM release with bundled-static dependencies
        required: true
        type: string
      llvm-revision:
        description: Exact 40-character LLVM source commit
        required: true
        type: string
      version:
        description: SDK version (for example go1.27.0-goallc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-22.04}
          - {os: linux, arch: arm64, runner: ubuntu-22.04-arm}
          - {os: darwin, arch: arm64, runner: macos-14}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      LLVM_RELEASE: ${{ inputs.llvm-release }}
      LLVM_REVISION: ${{ inputs.llvm-revision }}
      SDK_VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      GOAMD64: v1
      GOTOOLCHAIN: local
      GOENV: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache zstd
      - name: Install Darwin build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache zstd
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        run: bash .github/scripts/setup-windows-toolchain.bash
      - name: Download and verify LLVM payload
        run: |
          set -euo pipefail
          [[ "$LLVM_RELEASE" =~ ^goallc-llvm23\.1\.4-(v[0-9]+|[0-9]{8}T[0-9]{6}Z)$ ]]
          [[ "$LLVM_REVISION" =~ ^[0-9a-f]{40}$ ]]
          archive="$LLVM_RELEASE-$PLATFORM.tar.zst"
          url="https://github.com/goallc/llvm-project/releases/download/$LLVM_RELEASE/$archive"
          curl --fail --location --retry 5 "$url" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 5 "$url.sha256" -o "$RUNNER_TEMP/$archive.sha256"
          sha256_command=(sha256sum)
          if ! command -v sha256sum >/dev/null 2>&1; then
            sha256_command=(shasum -a 256)
          fi
          (cd "$RUNNER_TEMP" && "${sha256_command[@]}" --check "$archive.sha256")
          mkdir -p "$RUNNER_TEMP/llvm"
          zstd -dc "$RUNNER_TEMP/$archive" | tar -xf - -C "$RUNNER_TEMP/llvm" --strip-components=1
          grep -Fx "llvm_revision=$LLVM_REVISION" "$RUNNER_TEMP/llvm/share/goallc/build-manifest"
          grep -Fx 'llvm_dirty=false' "$RUNNER_TEMP/llvm/share/goallc/build-manifest"
          grep -Fx 'dependency_mode=bundled-static' "$RUNNER_TEMP/llvm/share/goallc/build-manifest"
      - name: Set version before bootstrap
        run: |
          [[ "$SDK_VERSION" =~ ^go[0-9][0-9A-Za-z.-]*$ ]]
          printf '%s\n' "$SDK_VERSION" > VERSION
      - name: Bootstrap static Unix SDK
        if: runner.os != 'Windows'
        working-directory: src
        run: ./make.bash -llvm-dir="$RUNNER_TEMP/llvm" -llvm-version=23 -llvm-link=static
      - name: Bootstrap static Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src
        run: |
          & .\make.bat "-llvm-dir=$env:RUNNER_TEMP/llvm" -llvm-version=23 -llvm-link=static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package SDK and record checksums
        run: |
          python3 .github/scripts/package-static-sdk.py --root "$GITHUB_WORKSPACE" \
            --llvm "$RUNNER_TEMP/llvm" --version "$SDK_VERSION" --output "$RUNNER_TEMP/release"
      - name: Relocate and remove build inputs
        run: |
          mkdir -p "$RUNNER_TEMP/relocated sdk"
          python3 - <<'PY'
          import os, pathlib, tarfile, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in (root/'release').iterdir():
              if p.name.endswith('.tar.gz'):
                  with tarfile.open(p) as t: t.extractall(root/'relocated sdk', filter='data')
              elif p.suffix == '.zip':
                  with zipfile.ZipFile(p) as z: z.extractall(root/'relocated sdk')
          PY
          mv "$RUNNER_TEMP/llvm" "$RUNNER_TEMP/llvm-hidden"
          mv pkg/goallc-llvmplugin "$RUNNER_TEMP/plugin-hidden"
      - name: Audit and test relocated SDK
        run: |
          python3 .github/scripts/verify-static-sdk.py "$RUNNER_TEMP/relocated sdk/go" \
            --windows-target --cgo --report "$RUNNER_TEMP/release/$PLATFORM-validation.json"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-sdk-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*-validation.json
          if-no-files-found: warn
      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-sdk-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          compression-level: 0
          if-no-files-found: error
