name: Bug report / 缺陷报告
description: Report a GoALLC build, compiler, or runtime problem / 反馈构建、编译器或运行时问题
body:
  - type: input
    id: version
    attributes:
      label: GoALLC version / 版本
      description: Paste the output of go version. / 粘贴 go version 输出。
      placeholder: go version go1.27.3-goallc.0.1.0 linux/amd64
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include OS, architecture, build flags, and relevant environment settings. / 提供系统、架构、构建参数和相关环境设置。
      placeholder: |
        go env GOOS GOARCH GOAMD64 GOARM64 GOEXPERIMENT CGO_ENABLED GOFLAGS GOTOOLCHAIN
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducer / 复现方法
      description: Include a small program or repository revision and exact commands. / 提供最小程序或仓库提交，以及完整命令。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include compiler errors, runtime output, or stack traces as text. / 以文本附上编译错误、运行输出或堆栈。
    validations:
      required: true
  - type: textarea
    id: official-go
    attributes:
      label: Comparison with official Go / 与官方 Go 的对比
      description: If tested, include the official Go version and result. / 如已对比，请提供官方 Go 版本与结果。
